# ============================================================
# 公共配置（非敏感，纳入版本库，所有环境共享默认值）
# 敏感配置（数据库账号密码、管理员邮箱等）请放在 application-local.properties，
# 该文件已被 .gitignore 忽略，不会提交。
# 覆盖规则：application-local.properties 中的同名配置会覆盖本文件的配置。
# ============================================================

# 激活当前运行环境：local（对应 application-local.properties）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------- 应用服务 WEB 访问端口 ----------
server.port=5050
# websocket 端口
ws.port=${EASYCHAT_WS_PORT:5051}
# servlet 上下文路径
server.servlet.context-path=/api
# session 过期时间
server.servlet.session.timeout=PT60M
# 处理 favicon
# spring.mvc.favicon.enabled=false
# servlet 最大上传文件大小
spring.servlet.multipart.max-file-size=15MB
# servlet 最大请求大小
spring.servlet.multipart.max-request-size=15MB
# 错误页处理
# spring.mvc.throw-exception-if-no-handler-found=true
# 控制静态资源处理
spring.web.resources.add-mappings=false

# ---------- 数据源通用配置（不含账号密码，凭据见 application-local.properties） ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HikariCPDataSource
spring.datasource.hikari.connection-test-query=SELECT 1

# ---------- mybatis 配置 ----------
mybatis.mapper-locations=classpath:mapper/*.xml

# ---------- flyway 数据库版本管理 ----------
# 是否启用（连接数据源后自动执行 db/migration 下的迁移脚本）
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# 迁移脚本位置（classpath，随 jar 一起打包，生产环境同样可自动迁移）
spring.flyway.locations=classpath:db/migration
# 迁移历史表
spring.flyway.table=flyway_schema_history
# 对「已存在且非空」的库自动建立基线，避免在存量库上重复执行 V1 基线脚本
spring.flyway.baseline-on-migrate=true
# 基线版本号，与 V1__baseline.sql 的版本号保持一致
spring.flyway.baseline-version=1
# 基线描述
spring.flyway.baseline-description=<< Flyway Baseline >>
# 执行前校验已应用脚本的 checksum，防止历史迁移脚本被改动
spring.flyway.validate-on-migrate=true
# 迁移脚本编码
spring.flyway.encoding=UTF-8
# 禁止 clean，避免误清空整库
spring.flyway.clean-disabled=true

# ---------- redis 配置 ----------
# redis 数据库索引
spring.data.redis.database=0
# redis 密码
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 连接池最大连接数
spring.data.redis.jedis.pool.max-active=20
# 连接池最大阻塞等待时间（使用负值表示没有限制）
spring.data.redis.jedis.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.data.redis.jedis.pool.max-idle=10
# 连接池中的最小空闲连接
spring.data.redis.jedis.pool.min-idle=1
# 连接超时时间
spring.data.redis.timeout=30000

# ---------- Knife4j 增强 UI 开关；生产可用环境变量 KNIFE4J_ENABLE=false 关闭 ----------
knife4j.enable=${KNIFE4J_ENABLE:true}
# 或者使用 knife4j 自带的生产环境保护
# knife4j.production=true

# ---------- 项目目录 ----------
project.folder=${EASYCHAT_PROJECT_FOLDER:${user.home}/easychat-file/}
# 是否开发环境
dev=${EASYCHAT_DEV:false}

# ---------- 日志配置 ----------
# 日志扫描周期
logging.scan-period=30 seconds
# 日志文件路径
logging.file.path=logs
# 日志格式
logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# 日志字符集
logging.charset=UTF-8
# 单个文件最大大小
logging.maxFileSize=10MB
# 保留历史记录天数
logging.maxHistory=30
# 总大小限制
logging.totalSizeCap=1GB
# 日志级别配置
logging.rootLevel=INFO
logging.easychatLevel=DEBUG
logging.springLevel=INFO
logging.hibernateLevel=WARN
logging.prodLevel=WARN
logging.devLevel=DEBUG
logging.exampleLevel=TRACE
